name: Everloom Durable Runtime

on:
  push:
    branches: [root]
    paths: ["runtime/durable/**", ".github/workflows/durable-runtime.yml"]
  pull_request:
    branches: [root]
    paths: ["runtime/durable/**", ".github/workflows/durable-runtime.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: runtime/durable

jobs:
  durable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1 httpx==0.28.1
      - name: Run durable core tests
        run: python -m pytest -q tests/test_cowlsly_durable_*.py tests/test_everloom_packaging.py
      - name: Build Everloom skill package
        run: python scripts/package_everloom.py --output dist/everloom-1.0.0.zip
      - name: Validate Everloom skill package
        run: python scripts/package_everloom.py --validate-only dist/everloom-1.0.0.zip
