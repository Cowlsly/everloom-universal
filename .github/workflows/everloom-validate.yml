name: Everloom Validate

on:
  push:
    branches: [root]
  pull_request:
    branches: [root]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Validate Everloom repository
        run: python scripts/validate_everloom.py

      - name: Compile validator
        run: python -m py_compile scripts/validate_everloom.py

      - name: Confirm no unresolved merge markers
        shell: bash
        run: |
          if grep -RIn --exclude-dir=.git -E '^(<<<<<<<|=======|>>>>>>>)' .; then
            echo "Unresolved merge markers found"
            exit 1
          fi
