<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="t d"><title id="t">Memory lifecycle</title><desc id="d">Capture, classify, recall under permission, review conflicts, correct or revoke, archive or forget, and verify backups and restoration.</desc><rect width="1000" height="460" rx="28" fill="#102521"/><g font-family="Arial,sans-serif"><text x="42" y="70" fill="#ddc38a" font-size="22" letter-spacing="5">MEMORY LIFECYCLE</text><text x="42" y="118" fill="#f0eee2" font-size="40">The owner can change the story.</text></g><g font-family="Arial,sans-serif" font-size="23" text-anchor="middle"><g fill="#204d40" stroke="#d0b479" stroke-width="2"><rect x="36" y="174" width="182" height="130" rx="22"/><rect x="230" y="174" width="182" height="130" rx="22"/><rect x="424" y="174" width="182" height="130" rx="22"/><rect x="618" y="174" width="182" height="130" rx="22"/><rect x="812" y="174" width="152" height="130" rx="22"/></g><g fill="#f0eee2"><text x="127" y="226">Capture</text><text x="127" y="261" font-size="18">with source</text><text x="321" y="226">Classify</text><text x="321" y="261" font-size="18">with consent</text><text x="515" y="226">Recall</text><text x="515" y="261" font-size="18">with scope</text><text x="709" y="226">Review</text><text x="709" y="261" font-size="18">and correct</text><text x="888" y="226">Forget</text><text x="888" y="261" font-size="18">or archive</text></g><g fill="#e7c58c" font-size="27"><text x="223" y="251">›</text><text x="417" y="251">›</text><text x="611" y="251">›</text><text x="806" y="251">›</text></g></g><text x="500" y="371" fill="#ccddd0" font-family="Arial,sans-serif" font-size="23" text-anchor="middle">Encrypted, integrity-checked backups and restore drills protect continuity.</text><text x="500" y="413" fill="#e6c58c" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">Production acceptance and deletion semantics are not yet verified.</text></svg>