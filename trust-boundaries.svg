<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Vault and sync trust boundaries</title><desc id="d">Private vault remains only in encrypted local storage. Ordinary sync can transfer eligible non-vault facts after verified owner and agent grants, through a restricted API, to PostgreSQL protected by row-level security.</desc><defs><linearGradient id="a" x2="1" y2="1"><stop stop-color="#081716"/><stop offset="1" stop-color="#1b4b3e"/></linearGradient></defs><rect width="1000" height="620" rx="30" fill="url(#a)"/><g font-family="Arial,sans-serif"><text x="48" y="68" fill="#dfc28d" font-size="22" letter-spacing="5">TRUST BOUNDARIES</text><text x="48" y="116" fill="#fff" font-size="42">Nothing crosses without permission.</text><rect x="50" y="160" width="325" height="340" rx="24" fill="#193a32" stroke="#a6d1b9"/><text x="80" y="207" fill="#f6d49d" font-size="24">OWNER DEVICE</text><rect x="82" y="234" width="264" height="90" rx="16" fill="#276451"/><text x="102" y="272" fill="#fff" font-size="24">General records</text><text x="102" y="302" fill="#dfeddf" font-size="18">Eligible for scoped sync</text><rect x="82" y="350" width="264" height="106" rx="16" fill="#3b312a" stroke="#e9c48a" stroke-dasharray="8 5"/><text x="102" y="391" fill="#f7dca4" font-size="24">Encrypted vault</text><text x="102" y="426" fill="#f7dca4" font-size="19">Never auto-synced</text><rect x="427" y="232" width="225" height="138" rx="24" fill="#203d37" stroke="#f6d49d"/><text x="451" y="277" fill="#fff" font-size="22">IDENTITY GATE</text><text x="451" y="310" fill="#c9dfd3" font-size="18">Owner + agent +</text><text x="451" y="339" fill="#c9dfd3" font-size="18">scope + expiry</text><rect x="700" y="160" width="250" height="340" rx="24" fill="#193a32" stroke="#a6d1b9"/><text x="726" y="207" fill="#f6d49d" font-size="24">PRIVATE CLOUD</text><text x="726" y="277" fill="#fff" font-size="26">PostgreSQL</text><text x="726" y="314" fill="#c9dfd3" font-size="20">Owner-isolated RLS</text><text x="726" y="352" fill="#c9dfd3" font-size="20">Ordered receipts</text><text x="726" y="390" fill="#c9dfd3" font-size="20">Restricted API</text><path d="M376 280 H421 M657 280 H693" stroke="#e9c48a" stroke-width="5"/><path d="M405 270L421 280 405 290 M677 270L693 280 677 290" stroke="#e9c48a" stroke-width="4" fill="none"/><path d="M360 411 H683" stroke="#f0ac80" stroke-dasharray="9 9" stroke-width="4"/><path d="M505 393L547 428 M547 393L505 428" stroke="#e9ac7f" stroke-width="8"/><text x="50" y="563" fill="#d8e4db" font-size="21">Cloud access is not universal. Private vault export needs a separate approved design.</text></g></svg>